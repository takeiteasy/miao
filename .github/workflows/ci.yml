name: ci

on:
  push:
    branches: [trunk]
    paths-ignore: ['docs/**', '**.md', LICENSE, .hut.scfg, .builds/**, .build.yml]
  pull_request:
    paths-ignore: ['docs/**', '**.md', LICENSE, .hut.scfg, .builds/**, .build.yml]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL
        # Apt's SBCL is too old to save-lisp-and-die reliably (#72,
        # segfaults inside its own C runtime); install a current upstream
        # binary release instead.
        run: |
          curl -sSfL https://sourceforge.net/projects/sbcl/files/sbcl/2.6.8/sbcl-2.6.8-x86-64-linux-binary.tar.bz2/download \
              -o sbcl.tar.bz2
          tar xjf sbcl.tar.bz2
          cd sbcl-2.6.8-x86-64-linux
          sudo sh install.sh

      - name: Install Quicklisp
        run: |
          curl -sSfLO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --no-userinit --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
          cp -R "$GITHUB_WORKSPACE" ~/quicklisp/local-projects/miao

      - name: Install dependencies outside Quicklisp
        run: |
          git clone --depth 1 https://github.com/takeiteasy/meow \
              ~/quicklisp/local-projects/meow
          git clone --depth 1 https://github.com/takeiteasy/trivial-high-precision-timer \
              ~/quicklisp/local-projects/trivial-high-precision-timer
          git clone --depth 1 https://github.com/takeiteasy/cl-inference \
              ~/quicklisp/local-projects/cl-inference

      - name: Test
        run: tests/test.sh
